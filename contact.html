<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      list-style: none;
      outline: none;
      border: none;
      font-family: system-ui;
    }
    .main {
      width: 100%;
      height: 100vh;
      background-color: black;
      position: relative;
    }
    nav {
      padding: 10px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: ease 1000ms;
    }
    .logo:hover {
      transform: scale(1.1);
    }
    nav ul {
      display: flex;
      gap: 1rem;
    }
    nav a {
      font-size: 0.8rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: ease 1000ms;
    }
    .content {
      max-width: 650px;
      padding: 10px 25px;
      position: absolute;
      top: 30%;
      left: 4%;
    }
    .content h1 {
      font-size: 2rem;
      font-weight: bold;
      color: white;
      padding: 5px 5px;
    }
    .content p {
      font-size: 0.95rem;
      font-weight: bold;
      color: red;
    }
    .content .info {
      font-weight: bold;
      font-size: 1.4rem;
      padding:10px 0;
      padding-top: 90px;
      color: white;
      max-width: 450px;
    }
    nav a:hover,
    nav .active {
      color: red;
    }
    .profile{
    width: 490px;
    height: 470px;
    background:url(images/gemini-2.5-flash-image-preview\ \(nano-banana\)_a_pls_remove_the_hand_.png) no-repeat;
    background-size: cover;
    background-position: center;
    cursor: pointer;
    transition: ease 1000ms;
    position: absolute;
    top: 90px;
    right: 5%;
    margin-left: 1000px;
  }
  .profile:hover{
    opacity: .2;
  }
  </style>

  <body>
    <div class="main">
      <nav>
        <div class="logo">
          <img
            src="images/ChatGPT Image Jun 5, 2026, 08_53_51 PM.png"
            width="160"

          />
        </div>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="movies.html">Movies</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
      <div class="content">
        <h1>Contact Us</h1>

          <li>YouTube: @devwebacademy934</li>
          <li>X: @DWacademy3847</li>
        </div>
      </div>
      <div class="profile"></div>
    </div>
  </body>
</html>
